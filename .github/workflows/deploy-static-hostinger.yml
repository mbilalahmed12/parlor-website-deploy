name: Deploy Static Website to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/out/**'
      - 'deployment-package/**'
      - '.github/workflows/deploy-static-hostinger.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build website
        env:
          NEXT_PUBLIC_API_URL: https://api.elegantedgeunisexsalon.in/api
          NEXT_PUBLIC_ENABLE_LIVE_API: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build --prefix frontend

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/out/
          server-dir: public_html/
          dangerous-clean-slate: false
          protocol: ftp
