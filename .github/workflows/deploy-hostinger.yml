name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy code
        run: |
          ssh -p "${{ secrets.HOSTINGER_SSH_PORT }}" "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" <<'EOF'
          set -e
          cd /var/www/parlor-website
          git pull origin main
          npm install --prefix backend
          npm install --prefix frontend
          npm run build --prefix frontend
          pm2 restart parlor-backend || pm2 start deploy/hostinger/ecosystem.config.cjs --only parlor-backend
          pm2 restart parlor-frontend || pm2 start deploy/hostinger/ecosystem.config.cjs --only parlor-frontend
          pm2 save
          EOF